<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icona di Trascrivi Audio: un'onda sonora che diventa righe di testo -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#0a4fa6"/>
    </linearGradient>
    <linearGradient id="lucido" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="ombra-piccola" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06306a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- forma standard delle icone macOS: 824×824 nella griglia 1024×1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sfondo)" filter="url(#ombra)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#lucido)"/>
  <g filter="url(#ombra-piccola)" fill="#ffffff">
    <!-- onda sonora -->
    <rect x="196" y="452" width="44" height="120" rx="22"/>
    <rect x="262" y="372" width="44" height="280" rx="22"/>
    <rect x="328" y="300" width="44" height="424" rx="22"/>
    <rect x="394" y="398" width="44" height="228" rx="22"/>
    <rect x="460" y="338" width="44" height="348" rx="22"/>
    <!-- righe di testo -->
    <rect x="556" y="352" width="272" height="44" rx="22"/>
    <rect x="556" y="440" width="228" height="44" rx="22"/>
    <rect x="556" y="528" width="272" height="44" rx="22"/>
    <rect x="556" y="616" width="176" height="44" rx="22"/>
  </g>
</svg>
